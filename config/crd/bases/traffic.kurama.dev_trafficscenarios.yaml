---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: trafficscenarios.traffic.kurama.dev
spec:
  group: traffic.kurama.dev
  names:
    kind: TrafficScenario
    listKind: TrafficScenarioList
    plural: trafficscenarios
    shortNames:
    - ts
    singular: trafficscenario
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.target.baseURL
      name: Target
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TrafficScenario declares a repeatable traffic generator. The controller
          turns it into a runner Deployment; it never sends target requests itself.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TrafficScenarioSpec is the desired HTTP workload and runner lifecycle.
              Suspending a scenario removes its runner Deployment without deleting its
              configuration.
            properties:
              operations:
                items:
                  properties:
                    capture:
                      properties:
                        jsonPointer:
                          pattern: ^/
                          type: string
                        store:
                          pattern: ^[a-z][a-z0-9-]{0,62}$
                          type: string
                      required:
                      - jsonPointer
                      - store
                      type: object
                    expectedStatusCodes:
                      items:
                        maximum: 599
                        minimum: 100
                        type: integer
                      minItems: 1
                      type: array
                    name:
                      pattern: ^[a-z][a-z0-9-]{0,62}$
                      type: string
                    request:
                      properties:
                        bodyTemplate:
                          maxLength: 65536
                          type: string
                        headers:
                          additionalProperties:
                            type: string
                          description: Literal sensitive headers are forbidden until
                            SecretRef-backed authentication is supported.
                          maxProperties: 64
                          type: object
                          x-kubernetes-validations:
                          - message: literal sensitive headers are forbidden; use
                              SecretRef support when it becomes available
                            rule: self.all(key, !key.lowerAscii().matches('^(authorization|proxy-authorization|cookie|set-cookie|x-api-key)$'))
                        method:
                          enum:
                          - GET
                          - POST
                          type: string
                        pathTemplate:
                          minLength: 1
                          type: string
                        variables:
                          items:
                            properties:
                              name:
                                pattern: ^[a-z][a-z0-9-]{0,62}$
                                type: string
                              source:
                                properties:
                                  length:
                                    maximum: 128
                                    minimum: 0
                                    type: integer
                                  store:
                                    pattern: ^[a-z][a-z0-9-]{0,62}$
                                    type: string
                                  type:
                                    enum:
                                    - randomUUID
                                    - randomBase62
                                    - store
                                    type: string
                                required:
                                - type
                                type: object
                            required:
                            - name
                            - source
                            type: object
                          type: array
                      required:
                      - method
                      - pathTemplate
                      type: object
                    weight:
                      maximum: 10000
                      minimum: 1
                      type: integer
                  required:
                  - expectedStatusCodes
                  - name
                  - request
                  - weight
                  type: object
                maxItems: 64
                minItems: 1
                type: array
              rate:
                properties:
                  limiter:
                    description: |-
                      Limiter selects how request permits are coordinated. When omitted, the
                      controller preserves the existing behaviour: memory storage uses a local
                      limiter and Redis storage uses a distributed Redis limiter.
                    properties:
                      type:
                        enum:
                        - local
                        - redis
                        type: string
                    type: object
                  profile:
                    description: |-
                      Profile controls the delay between request attempts. When omitted, the
                      original fixed-interval scheduling behaviour is preserved.
                    properties:
                      delayDivisor:
                        description: |-
                          DelayDivisor controls how much faster requests inside a burst are sent
                          compared with the mean interval. The post-burst pause compensates for
                          this acceleration so the configured average rate is preserved. When
                          omitted from a burst profile, the runner uses 10.
                        maximum: 100
                        minimum: 2
                        type: integer
                      maxBurstSize:
                        description: MaxBurstSize is required for the burst profile
                          and is inclusive.
                        maximum: 100
                        minimum: 2
                        type: integer
                      minBurstSize:
                        description: |-
                          MinBurstSize is required for the burst profile and includes the first
                          request in each burst.
                        maximum: 100
                        minimum: 2
                        type: integer
                      type:
                        enum:
                        - fixed
                        - uniform
                        - burst
                        type: string
                    type: object
                  schedule:
                    properties:
                      maxRequestsPerMinute:
                        maximum: 6000
                        minimum: 1
                        type: integer
                      minRequestsPerMinute:
                        maximum: 6000
                        minimum: 1
                        type: integer
                      requestsPerMinute:
                        maximum: 6000
                        minimum: 1
                        type: integer
                      type:
                        enum:
                        - fixed
                        - uniform
                        type: string
                      windowMinutes:
                        maximum: 1440
                        minimum: 1
                        type: integer
                    required:
                    - type
                    type: object
                required:
                - schedule
                type: object
              replicas:
                description: |-
                  Replicas controls the number of runner Pods. Values greater than one
                  require a distributed Redis rate limiter.
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              storage:
                properties:
                  type:
                    description: |-
                      Type selects the backend shared by all declared stores. An omitted value
                      preserves the in-memory backend used by existing scenarios.
                    enum:
                    - memory
                    - redis
                    type: string
                type: object
              stores:
                items:
                  properties:
                    capacity:
                      maximum: 100000
                      minimum: 1
                      type: integer
                    name:
                      pattern: ^[a-z][a-z0-9-]{0,62}$
                      type: string
                  required:
                  - capacity
                  - name
                  type: object
                maxItems: 32
                type: array
              suspend:
                type: boolean
              target:
                properties:
                  baseURL:
                    description: |-
                      BaseURL must be an absolute HTTP or HTTPS URL. Cluster-local Services are
                      expected to use their normal Kubernetes DNS name here.
                    pattern: ^https?://.+
                    type: string
                required:
                - baseURL
                type: object
            required:
            - operations
            - rate
            - target
            type: object
          status:
            description: TrafficScenarioStatus is controller-owned observed state.
            properties:
              conditions:
                description: Conditions describe the observed runner lifecycle and
                  rollout state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
